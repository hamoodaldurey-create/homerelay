name: Import verified source snapshot
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Restore exact source snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://github.com/${GITHUB_REPOSITORY}.git" repository
          cd repository
          python3 - <<'PYCODE'
          import hashlib, pathlib, zipfile
          archive = pathlib.Path('source.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '72b1dbb0fe4d4b4c91230140dfa6479553f262a15b6cff242fae99bf22af3046', 'Source archive changed; review it before importing'
          with zipfile.ZipFile(archive) as source:
              for info in source.infolist():
                  path = pathlib.PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert (info.external_attr >> 16) & 0o170000 != 0o120000, 'Symlinks are not allowed'
                  if info.filename in {'README.md', 'SUBMISSION.md'}:
                      continue
                  source.extract(info)
          PYCODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Expand verified source snapshot into reviewable project files'
          header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $header" push origin HEAD:main
